<main class="flex min-h-screen items-center justify-center px-6 py-12">
  <section
    aria-labelledby="playground-title"
    class="app-card w-full max-w-2xl rounded-4xl border p-8 backdrop-blur sm:p-10"
  >
    <header>
      <p class="text-main text-sm font-semibold tracking-[0.22em] uppercase">Angular Playground</p>
      <h1 class="mt-3 text-4xl font-semibold tracking-tight sm:text-6xl" id="playground-title">
        {{ message }}
      </h1>
      <p class="app-copy mt-4 max-w-xl text-base leading-7" id="playground-description">
        Tailwind CSS v4 is now wired with PostCSS using the CSS-first setup, and this view still
        reuses the shared <code class="app-code rounded px-1.5 py-0.5">greet()</code> helper.
      </p>
    </header>

    <form aria-describedby="playground-description" class="mt-8">
      <label class="app-field-label block text-sm font-medium" for="name">Name</label>
      <input
        [(ngModel)]="name"
        (ngModelChange)="onNameChange($event)"
        autocomplete="name"
        class="app-input focus:border-main focus:ring-main/20 mt-2 w-full rounded-2xl border px-4 py-3 text-base transition outline-none focus:bg-white focus:ring-4 dark:focus:bg-transparent"
        id="name"
        name="name"
        placeholder="World"
        type="text"
      />
    </form>
  </section>
</main>

<router-outlet />
